plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = mod_version
group = mod_group_id

def localEnv = [:]
def localEnvFile = file('.env')
if (localEnvFile.isFile()) {
    localEnvFile.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) return
        def parts = trimmed.split('=', 2)
        localEnv[parts[0].trim()] = parts[1].trim().replaceAll(/^['"]|['"]$/, '')
    }
}

def publishingSecret = { String name ->
    providers.environmentVariable(name).orElse(providers.provider { localEnv[name] })
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            if (providers.gradleProperty('autoConnect').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument 'localhost:25565'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
        configureEach { gameDirectory = project.file("run-${minecraft_version}") }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

repositories { mavenCentral() }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'com.mojang:logging:1.2.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('runServer') { standardInput = System.in }
tasks.named('jar', Jar) {
    from(rootProject.files('LICENSE', 'NOTICE')) { into 'META-INF' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                 mod_version: mod_version]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

def publishModVersion = mod_version.toString()
def publishChangelogFile = file("metadata/changelogs/${publishModVersion}.md")
def curseForgeToken = publishingSecret('CURSEFORGE_TOKEN')
def curseForgeProjectId = publishingSecret('CURSEFORGE_PROJECT_ID')
def curseForgeProjectSlug = publishingSecret('CURSEFORGE_PROJECT_SLUG')

publishMods {
    file = jar.archiveFile
    changelog = publishChangelogFile.exists() ? publishChangelogFile.text.trim() : ''
    type = ALPHA
    modLoaders.add('neoforge')

    curseforge {
        projectId = curseForgeProjectId
        projectSlug = curseForgeProjectSlug
        accessToken = curseForgeToken
        minecraftVersions.add(minecraft_version)
    }
}

def validateCurseForgePublish = tasks.register('validateCurseForgePublish') {
    inputs.file(publishChangelogFile)

    doLast {
        if (!publishChangelogFile.isFile() || publishChangelogFile.text.trim().isEmpty()) {
            throw new GradleException("${publishChangelogFile} is required and must not be empty.")
        }
        if (!publishChangelogFile.text.contains(publishModVersion)) {
            throw new GradleException("${publishChangelogFile} must mention mod_version ${publishModVersion}.")
        }
        [CURSEFORGE_TOKEN: curseForgeToken,
         CURSEFORGE_PROJECT_ID: curseForgeProjectId,
         CURSEFORGE_PROJECT_SLUG: curseForgeProjectSlug].each { name, value ->
            if (!value.isPresent() || value.get().trim().isEmpty()) {
                throw new GradleException("${name} must be set in the environment or the ignored .env file.")
            }
        }
    }
}

tasks.named('publishCurseforge') {
    dependsOn validateCurseForgePublish
}
