modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TheonlyTazz; based on work by Sakura-Ryoko and contributors"
description='''Leave a server-side AFK replacement behind when you disconnect.'''
displayURL="https://github.com/TheonlyTazz/AFK-Unplug"
logoFile="assets/unplugged_afk/icon.png"

[[mixins]]
config="unplugged_afk.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

